name: MathJax Render

on: [push]

jobs:
  render_mathjax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v2
      
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y npm
          npm install mathjax@3
      
      - name: Render MathJax
        run: |
          node_modules/.bin/npx mathjax-full@3 --tex '{x+1 \over \sqrt{x}}' --mml '<math xmlns="http://www.w3.org/1998/Math/MathML"><mfrac><mrow><mi>x</mi><mo>+</mo><mn>1</mn></mrow><msqrt><mi>x</mi></msqrt></mfrac></math>' --output README.md --format md

